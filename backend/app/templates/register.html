<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Heart Shield</title>
   <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body { margin:0; font-family: Arial, sans-serif; background:#f7f7fb; }
    .navbar { display:flex; justify-content:space-between; align-items:center;
              padding:15px 40px; background:linear-gradient(90deg,#6a11cb,#2575fc); color:#fff; }
    .navbar .logo { font-size:22px; font-weight:bold; }
    .navbar ul { list-style:none; display:flex; gap:20px; margin:0; padding:0; }
    .navbar ul li a { color:#fff; text-decoration:none; font-weight:500; transition:0.3s; }
    .navbar ul li a:hover { color:#ffd369; }
    .register-box {
      width:400px; margin:80px auto; background:#fff; padding:30px;
      border-radius:10px; box-shadow:0 4px 15px rgba(0,0,0,0.1);
      text-align:center;
    }
    h2 { color:#2575fc; margin-bottom:20px; }
    input, select {
      width:100%; padding:12px; margin:10px 0;
      border:1px solid #ccc; border-radius:5px;
    }
    .btn { width:100%; padding:12px; background:linear-gradient(90deg,#6a11cb,#2575fc);
           border:none; border-radius:5px; color:white; font-size:16px; cursor:pointer; }
    .btn:hover { opacity:0.9; }
    .extra { margin-top:15px; font-size:14px; }
    .extra a { color:#6a11cb; text-decoration:none; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">❤️ Heart Shield</div>
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/login">Login</a></li>
      <li><a href="/register">Register</a></li>
     <!-- <li><a href="/predict">Predict</a></li>
      <li><a href="/upload">Upload</a></li>-->
      <li><a href="/profile">Profile</a></li>
    </ul>
  </nav>

  <div class="register-box">
    <h2>Create Account</h2>
    <!-- ✅ only id, no action/method -->
    <form id="registerForm">
      <input type="text" id="username" name="username" placeholder="Username" required />
      <input type="email" id="email" name="email" placeholder="Email" required />
      <input type="password" id="password" name="password" placeholder="Password" required />
      <select id="role" name="role" required>
        <option value="patient">Patient</option>
        <option value="doctor">Doctor</option>
      </select>
      <button type="submit" class="btn">Register</button>
    </form>
    <div class="extra">
      Already have an account? <a href="/login">Login here</a>
    </div>
  </div>

  <!-- ✅ script at very end -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("registerForm");

      form.addEventListener("submit", async function(e) {
        e.preventDefault(); // stop page reload

        const username = document.getElementById("username").value;
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const role = document.getElementById("role").value;

        try {
          const res = await fetch("http://127.0.0.1:5000/api/users/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, email, password, role })
          });

          const data = await res.json();

          if (res.ok) {
            alert("✅ Registration successful! Please login now.");
            window.location.href = "/upload";
          } else {
            alert("❌ " + (data.error || "Registration failed"));
          }
        } catch (err) {
          alert("Server error: " + err.message);
        }
      });
    });
  </script>
</body>
</html>
