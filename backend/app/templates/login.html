<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heart Shield - Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <!-- Header Banner -->
  <header class="header">
    <h1>❤️ Heart Shield</h1>
    <p>Your personal health dashboard</p>
  </header>

  <!-- Login Card -->
  <main class="container">
    <div class="card login-card">
      <h2>Sign In</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="identifier">Email or Username</label>
          <input type="text" id="identifier" placeholder="Enter email or username" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn-primary">Sign In</button>
      </form>
      <div class="form-footer">
        <a href="#">Forgot password?</a>
        <p>Don’t have an account? <a href="/register">Create one here</a></p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>© 2025 Heart Shield</p>
  </footer>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const identifier = document.getElementById("identifier").value;
      const password = document.getElementById("password").value;

      try {
        const res = await fetch("http://127.0.0.1:5000/api/users/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username:identifier,email:identifier, password :password})
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem("token", data.access_token);
          window.location.href = "/upload";
        } else {
          alert(data.error || "Login failed!");
        }
      } catch (err) {
        alert("Server error: " + err.message);
      }
    });
  </script>

</body>
</html>
